    "ipv4-subnet": "auto",
    "ipv6-subnet": "auto"
  },
  "topology": {
    "kinds": {
      "nokia_srlinux": {
        "image": "ghcr.io/nokia/srlinux:25.3.2",
        "image-pull-policy": "if-not-present",
        "startup-config": "srl-startup.conf"
      }
    },
    "nodes": {
      "a-core": {
        "kind": "nokia_srlinux"
      },
      "b-core": {
        "kind": "nokia_srlinux"
      },
      "c-core": {
