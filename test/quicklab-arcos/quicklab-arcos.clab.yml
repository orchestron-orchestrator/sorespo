name: sorespo-quicklab-arcos
# The prefix is prepended to container node names. We override the default
# "clab-<lab-name>-" prefix here by using the "__lab-name" magic value.
# Containerlab replaces it with the lab name defined above. This ensures we're
# creating unique containers for each instance of the lab based on the same
# topology (=testenv).
prefix: __lab-name

mgmt:
  network: sorespo-quicklab-arcos
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  kinds:
    arrcus_arcos:
      image: ${IMAGE_PATH}arcos:8.2.1A.P4
      startup-config: arcos-startup.conf
    linux:
      image: quay.io/frrouting/frr:10.3.1
      image-pull-policy: if-not-present
  nodes:
    ams-core-1:
      kind: arrcus_arcos
    fra-core-1:
      kind: arrcus_arcos
    sto-core-1:
      kind: arrcus_arcos
    lju-core-1:
      kind: arrcus_arcos
    cust-1:
      kind: linux
      binds:
        - ../common/cust-1-frr.conf:/etc/frr/frr.conf
        - ../common/frr-daemons.conf:/etc/frr/daemons
      exec:
        - ip link set dev eth1 address 00:C1:AB:00:01:01
        - ip link add link eth1 name eth1.100 type vlan id 100
        - ip link set dev eth0 down
        - touch /etc/frr/vtysh.conf
    cust-2:
      kind: linux
      binds:
        - ../common/cust-2-frr.conf:/etc/frr/frr.conf
        - ../common/frr-daemons.conf:/etc/frr/daemons
      exec:
        - ip link set dev eth1 address 00:C1:AB:00:01:01
        - ip link add link eth1 name eth1.100 type vlan id 100
        - ip link set dev eth0 down
        - touch /etc/frr/vtysh.conf
    cust-3:
      kind: linux
      binds:
        - ../common/cust-3-frr.conf:/etc/frr/frr.conf
        - ../common/frr-daemons.conf:/etc/frr/daemons
      exec:
        - ip link set dev eth1 address 00:C1:AB:00:01:01
        - ip link add link eth1 name eth1.100 type vlan id 100
        - ip link set dev eth0 down
        - touch /etc/frr/vtysh.conf
    cust-4:
      kind: linux
      binds:
        - ../common/cust-4-frr.conf:/etc/frr/frr.conf
        - ../common/frr-daemons.conf:/etc/frr/daemons
      exec:
        - ip link set dev eth1 address 00:C1:AB:00:01:01
        - ip link add link eth1 name eth1.100 type vlan id 100
        - ip link set dev eth0 down
        - touch /etc/frr/vtysh.conf
    sweave:
      kind: linux
      image: sorespo-sweave-base
      image-pull-policy: if-not-present
      ports:
        - "80/tcp"
        - "830/tcp"

  links:
    - endpoints: ["ams-core-1:swp0", "fra-core-1:swp0"]
    - endpoints: ["ams-core-1:swp1", "sto-core-1:swp0"]
    - endpoints: ["fra-core-1:swp1", "sto-core-1:swp1"]
    - endpoints: ["fra-core-1:swp2", "lju-core-1:swp0"]
    - endpoints: ["sto-core-1:swp2", "lju-core-1:swp1"]
    - endpoints: ["ams-core-1:swp2", "cust-1:eth1"]
    - endpoints: ["fra-core-1:swp3", "cust-2:eth1"]
    - endpoints: ["sto-core-1:swp3", "cust-3:eth1"]
    - endpoints: ["lju-core-1:swp2", "cust-4:eth1"]
