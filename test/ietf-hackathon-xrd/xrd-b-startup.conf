!
hostname {{ .ShortName }}
!
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
interface GigabitEthernet0/0/0/0
 description External link to SoReSpo-managed network
 ipv4 address 10.0.48.2 255.255.255.0
 ipv4 address 10.0.48.4 255.255.255.0 secondary
!
router bgp 65002
 bgp router-id 10.0.48.2
 address-family ipv4 unicast
 !
 neighbor 10.0.48.1
  remote-as 65001
  local address 10.0.48.2
  description SoReSpo-managed peer
  address-family ipv4 unicast
  !
 !
 neighbor 10.0.48.3
  remote-as 65001
  local address 10.0.48.4
  description SoReSpo-managed peer 2
  address-family ipv4 unicast
  !
 !
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
ssh server v2
ssh server rate-limit 6000
ssh server session-limit 110
ssh server netconf vrf default
end
